server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación usa enrutado del lado del cliente: cualquier ruta
    # desconocida debe devolver index.html para que React Router la
    # resuelva, en lugar de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los recursos con hash en el nombre son inmutables: se cachean para
    # siempre. index.html NO, o los usuarios se quedarían con una versión
    # antigua tras cada despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La cámara solo se usa desde el propio origen.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}
