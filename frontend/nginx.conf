server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── La API va por aquí, y no directa al Gateway ──────────────────
    #
    # Antes el bundle llevaba incrustado `http://localhost:3000/api/v1`,
    # y eso ataba la aplicación a UNA máquina: abierta desde el móvil o
    # desde otro portátil de la red, el navegador buscaba el Gateway en
    # el localhost de ESE dispositivo y no encontraba nada.
    #
    # Sirviéndola desde el mismo origen que la página, la dirección pasa
    # a ser relativa (`/api/v1`) y funciona desde donde sea. De paso
    # desaparece el CORS del navegador: ya no hay dos orígenes.
    #
    # Y es lo que hace posible TLS. Una página en https que llamara a un
    # `http://localhost:3000` sería contenido mixto y el navegador la
    # bloquearía, así que sin este proxy el HTTPS no podría existir.
    location /api/ {
        # EL NOMBRE SE RESUELVE EN CADA PETICIÓN, no al arrancar.
        #
        # Con `proxy_pass http://api-gateway:3000` literal, nginx
        # resuelve el nombre al cargar la configuración y se NIEGA A
        # ARRANCAR si el Gateway todavía no existe: «host not found in
        # upstream». Eso convierte un arranque en frío, donde los
        # contenedores levantan en paralelo, en un frontend muerto que
        # además no se recupera solo.
        #
        # Con el resolver de Docker y el nombre en una variable, la
        # resolución se aplaza a la petición: si el Gateway aún no está,
        # se falla ESA petición y la siguiente ya funciona.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway api-gateway;

        # `$request_uri` conserva la ruta completa y la query. Con una
        # variable en `proxy_pass`, nginx no reescribe el URI por su
        # cuenta, así que hay que pasarlo entero a mano.
        proxy_pass http://$gateway:3000$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lo lee el Gateway para saber si la petición original venía por
        # TLS. Sin esto, detrás de este proxy todo parecería http.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Por aquí viajan frames de la cámara y audio del parte de
        # relevo. El defecto de nginx es 1 MB y cortaría las subidas con
        # un 413 que en la interfaz parecería un fallo del servidor.
        client_max_body_size 25m;

        # Un frame tarda ~750 ms y una transcripción con Deepgram puede
        # irse a varios segundos.
        proxy_read_timeout 60s;

        include /etc/nginx/conf.d/security-headers.conf;
    }

    # La aplicación usa enrutado del lado del cliente: cualquier ruta
    # desconocida debe devolver index.html para que React Router la
    # resuelva, en lugar de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Los recursos con hash en el nombre son inmutables: se cachean para
    # siempre. index.html NO, o los usuarios se quedarían con una versión
    # antigua tras cada despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
