# Cabeceras de seguridad, en un archivo aparte Y POR UN MOTIVO.
#
# nginx NO hereda `add_header` hacia dentro: en cuanto un bloque
# `location` declara UNA sola cabecera, deja de aplicar TODAS las del
# bloque padre. Y `always` no arregla esto, porque no va de codigos de
# estado sino de herencia.
#
# Aqui eso significaba que las cuatro cabeceras de abajo estaban
# escritas en el server y NO SE ENVIABAN EN NINGUNA RESPUESTA, porque
# las tres locations declaraban su propio Cache-Control. Comprobado con
# `curl -I` contra el contenedor: ni en la pagina, ni en los assets, ni
# en una ruta de la SPA.
#
# Teniendolas en un include, anadir una location nueva sin acordarse de
# esto sigue siendo posible, pero el `include` es una sola linea y se ve
# que falta.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La camara y el MICROFONO, los dos desde el propio origen.
#
# El microfono estaba en `()` -bloqueado- y eso habria roto el dictado
# del parte de relevo, que llama a getUserMedia({audio:true}). No se
# noto porque la cabecera no llegaba a enviarse: un fallo tapaba al
# otro.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
