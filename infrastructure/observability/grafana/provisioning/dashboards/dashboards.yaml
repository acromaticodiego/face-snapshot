apiVersion: 1

providers:
  - name: detector
    orgId: 1
    folder: 'Observabilidad'
    type: file
    disableDeletion: false
    # Los paneles se editan en la interfaz pero la verdad esta en el
    # repositorio: al recargar se vuelven a leer de los archivos.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
