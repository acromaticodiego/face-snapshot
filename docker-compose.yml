# ══════════════════════════════════════════════════════════════════
#  Sistema de control de acceso por reconocimiento facial
#
#  Arranque:
#      cp .env.example .env    (y rellenar los valores)
#      docker compose up --build
#
#  La primera construcción tarda: el Vision Service descarga PyTorch y
#  los modelos de InsightFace (~700 MB en total).
#
#  La decisión inicial fue no tener broker (ADR 0005). Se cumplieron
#  dos de los disparadores que aquel ADR dejó anotados —la presencia
#  debe salir del camino crítico y las ventanas de votación tienen que
#  compartirse— y por eso ahora hay Redis, y solo Redis: ni RabbitMQ ni
#  MinIO. El razonamiento está en el ADR 0007.
# ══════════════════════════════════════════════════════════════════

name: backend-detector

services:
  # ── Base de datos ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: detector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facedetector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-face_access}
      # Las contraseñas de los roles por servicio llegan como opciones de
      # sesión para que el script de inicialización pueda leerlas sin
      # escribirlas en el propio SQL.
      POSTGRES_INITDB_ARGS: >-
        -c custom.face_svc_password=${FACE_SVC_DB_PASSWORD:?Define FACE_SVC_DB_PASSWORD}
        -c custom.access_svc_password=${ACCESS_SVC_DB_PASSWORD:?Define ACCESS_SVC_DB_PASSWORD}
        -c custom.auth_svc_password=${AUTH_SVC_DB_PASSWORD:?Define AUTH_SVC_DB_PASSWORD}
        -c custom.shift_svc_password=${SHIFT_SVC_DB_PASSWORD:?Define SHIFT_SVC_DB_PASSWORD}
    ports:
      # Expuesto solo en localhost: la base de datos no debe ser
      # alcanzable desde la red local.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-facedetector} -d ${POSTGRES_DB:-face_access}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [detector-net]

  # ── Bus de eventos y estado compartido ──────────────────────────
  #
  # Redis hace dos cosas y ninguna es decidir accesos:
  #   · transporta los eventos de acceso hacia el Shift Service
  #   · guarda las ventanas de votación compartidas entre réplicas
  #
  # Si se cae, las puertas siguen funcionando: la votación degrada a
  # memoria y los eventos se acumulan en la outbox hasta que vuelva.
  redis:
    image: redis:8-alpine
    container_name: detector-redis
    restart: unless-stopped
    # `appendonly` porque los eventos pendientes de consumir no deben
    # perderse en un reinicio: son horas trabajadas de alguien.
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    ports:
      # 6380 y no 6379, por el mismo motivo que PostgreSQL usa 5433:
      # es habitual tener ya un Redis nativo en el puerto estándar.
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [detector-net]

  # ── Visión: detección + embeddings ──────────────────────────────
  vision-service:
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
    container_name: detector-vision
    restart: unless-stopped
    environment:
      FACE_DETECTOR_BACKEND: ${FACE_DETECTOR_BACKEND:-yolo}
      YOLO_FACE_MODEL_PATH: /app/modelos/rostros.pt
      YOLO_CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE_THRESHOLD:-0.45}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-640}
      MIN_FACE_SIZE_PX: ${MIN_FACE_SIZE_PX:-80}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Procesos de inferencia. El defecto es UNO porque se midio:
      # el segundo worker no da nada distinguible del ruido y cuesta
      # casi el doble de memoria, ya que cada uno carga su propia
      # copia de rostros.pt, de los landmarks y de ArcFace. Las
      # cifras estan en el Dockerfile del servicio. No lo subas sin
      # volver a medir en la maquina donde vaya a correr.
      VISION_WORKERS: ${VISION_WORKERS:-1}
      # Vacio a proposito: sin valor, lo decide torch (la mitad de los
      # nucleos de la maquina). Solo hay que ponerle un numero si se
      # suben los workers, para que no se peleen por los nucleos.
      VISION_THREADS_PER_WORKER: ${VISION_THREADS_PER_WORKER:-}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    volumes:
      # El modelo se monta en SOLO LECTURA: el contenedor no puede
      # modificarlo ni sobrescribirlo.
      - ./modelos:/app/modelos:ro
    # Sin `ports`: es un servicio interno. Solo el Face Service lo llama.
    expose:
      - '8000'
    networks: [detector-net]

  # ── Identidades y vectores faciales ─────────────────────────────
  face-service:
    build:
      context: ./services/face-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nest-prisma
      args:
        PORT: '3001'
    container_name: detector-face
    restart: unless-stopped
    environment:
      FACE_DATABASE_URL: postgresql://face_svc_user:${FACE_SVC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-face_access}?schema=face_svc
      FACE_SERVICE_PORT: '3001'
      VISION_SERVICE_URL: http://vision-service:8000
      EMBEDDING_DIM: '512'
      RECOGNITION_THRESHOLD: ${RECOGNITION_THRESHOLD:-0.38}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-8}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    networks: [detector-net]

  # ── Decisión de acceso y auditoría ──────────────────────────────
  access-service:
    build:
      context: ./services/access-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nest-prisma
      args:
        PORT: '3002'
    container_name: detector-access
    restart: unless-stopped
    environment:
      ACCESS_DATABASE_URL: postgresql://access_svc_user:${ACCESS_SVC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-face_access}?schema=access_svc
      ACCESS_SERVICE_PORT: '3002'
      FACE_SERVICE_URL: http://face-service:3001
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      RECOGNITION_VOTES_REQUIRED: ${RECOGNITION_VOTES_REQUIRED:-3}
      RECOGNITION_WINDOW_SIZE: ${RECOGNITION_WINDOW_SIZE:-5}
      RECOGNITION_WINDOW_TTL_MS: ${RECOGNITION_WINDOW_TTL_MS:-10000}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-8}
      # Dentro de la red de Docker el puerto es el estándar; el 6380 de
      # `ports` solo afecta a quien se conecte desde el host.
      REDIS_URL: redis://redis:6379
      # 'memory' fuerza la votación local aunque haya Redis. Útil para
      # depurar sin el ruido de otras réplicas.
      VOTE_WINDOW_BACKEND: ${VOTE_WINDOW_BACKEND:-redis}
      # Dos lecturas del mismo rostro en la misma puerta dentro de esta
      # ventana son el mismo paso, no dos.
      ANTIPASSBACK_GRACE_SECONDS: ${ANTIPASSBACK_GRACE_SECONDS:-10}
      # Deteccion de vida. El defecto es SOFT -anota la sospecha y deja
      # pasar- porque la senal NO esta validada contra ataques reales.
      # Poner HARD sin haber mirado antes lo que SOFT registra es
      # empezar a dejar gente en la calle con un numero sin calibrar.
      LIVENESS_MODE: ${LIVENESS_MODE:-SOFT}
      LIVENESS_MIN_DETAIL_RATIO: ${LIVENESS_MIN_DETAIL_RATIO:-0.25}
      LIVENESS_MAX_PATTERN_PEAK: ${LIVENESS_MAX_PATTERN_PEAK:-90}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-168}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    expose:
      - '3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      face-service:
        condition: service_started
    networks: [detector-net]

  # ── Autenticacion de administradores ────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nest-prisma
      args:
        PORT: '3003'
    container_name: detector-auth
    restart: unless-stopped
    environment:
      AUTH_DATABASE_URL: postgresql://auth_svc_user:${AUTH_SVC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-face_access}?schema=auth_svc
      AUTH_SERVICE_PORT: '3003'
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ADMIN_TOKEN_EXPIRES_IN: ${ADMIN_TOKEN_EXPIRES_IN:-8h}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@detector.local}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Administrador}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Define ADMIN_BOOTSTRAP_PASSWORD en .env}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    expose:
      - '3003'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [detector-net]

  # ── Jornada laboral: presencia, turnos y horas ──────────────────
  #
  # Es una PROYECCION de los eventos del Access Service: no decide
  # nada que abra una puerta. Si se cae, o si hubiera que reconstruirlo
  # entero reprocesando el stream, nadie se quedaria fuera del
  # edificio.
  shift-service:
    build:
      context: ./services/shift-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nest-prisma
      args:
        PORT: '3004'
    container_name: detector-shift
    restart: unless-stopped
    environment:
      SHIFT_DATABASE_URL: postgresql://shift_svc_user:${SHIFT_SVC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-face_access}?schema=shift_svc
      SHIFT_SERVICE_PORT: '3004'
      REDIS_URL: redis://redis:6379
      # Una pausa mas larga que esto deja de ser una pausa y pasa a ser
      # el final de la jornada, con la hora de la salida.
      SHIFT_PAUSE_TIMEOUT_MINUTES: ${SHIFT_PAUSE_TIMEOUT_MINUTES:-90}
      # Una jornada abierta mas tiempo que esto es alguien que se fue
      # sin fichar, no un turno.
      SHIFT_MAX_HOURS: ${SHIFT_MAX_HOURS:-16}
      RECONCILER_INTERVAL_MS: ${RECONCILER_INTERVAL_MS:-60000}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    expose:
      - '3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [detector-net]

  # ── Punto de entrada del frontend ───────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../infrastructure/docker/Dockerfile.nest
      args:
        PORT: '3000'
    container_name: detector-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: '3000'
      FACE_SERVICE_URL: http://face-service:3001
      ACCESS_SERVICE_URL: http://access-service:3002
      SHIFT_SERVICE_URL: http://shift-service:3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3003
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-8}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      # ── Observabilidad ──────────────────────────────────────────
      # Sin OTEL_EXPORTER_OTLP_ENDPOINT el servicio arranca sin
      # instrumentacion. Es el interruptor: el colector NO es una
      # dependencia, y por eso tampoco aparece en `depends_on`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    # El ÚNICO servicio publicado hacia fuera.
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      face-service:
        condition: service_started
      access-service:
        condition: service_started
      auth-service:
        condition: service_started
      shift-service:
        condition: service_started
    networks: [detector-net]

  # ══════════════════════════════════════════════════════════════
  #  OBSERVABILIDAD
  #
  #  Cuatro contenedores y un solo camino:
  #
  #      servicios ──OTLP──> collector ──> tempo      (trazas)
  #                              └────────> prometheus (metricas)
  #                                              └───> grafana
  #
  #  Ninguno de los cuatro es una dependencia de nadie. Si el colector
  #  desaparece, los servicios descartan telemetria en silencio con una
  #  cola acotada y las puertas siguen abriendose igual. Por eso
  #  tampoco aparece en ningun `depends_on` de los servicios ni en
  #  ningun `/health`: convertir una averia de telemetria en una averia
  #  de control de acceso seria cambiar un problema pequeno por uno
  #  grave.
  # ══════════════════════════════════════════════════════════════

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: detector-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    expose:
      - '4318'  # OTLP/HTTP, que es por donde entran los seis servicios
      - '4317'  # OTLP/gRPC
      - '8889'  # metricas para Prometheus
      - '8888'  # sus propias metricas
    depends_on:
      - tempo
    networks: [detector-net]

  tempo:
    image: grafana/tempo:3.0.3
    container_name: detector-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yaml']
    user: root
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - '3200'  # consulta, que es lo que usa Grafana
      - '4317'  # OTLP/gRPC, solo desde el colector
    networks: [detector-net]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: detector-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      # Sin esto, los exemplars llegan y se tiran: es lo que permite
      # saltar de un pico de latencia a la traza que lo causo.
      - '--enable-feature=exemplar-storage'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Solo en localhost: son metricas de operacion, no una pagina
      # publica.
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    networks: [detector-net]

  grafana:
    image: grafana/grafana:13.2.1
    container_name: detector-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Registrarse uno mismo en un panel de operacion interno no tiene
      # ningun sentido, y deja la puerta abierta.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3001 porque el 3000 lo ocupa el Gateway en el host.
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    depends_on:
      - prometheus
      - tempo
    networks: [detector-net]

  # ── Interfaz ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
        VITE_TERMINAL_KEY: ${VITE_TERMINAL_KEY:-main-entrance}
    container_name: detector-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      - api-gateway
    networks: [detector-net]

volumes:
  postgres-data:
    name: detector-postgres-data
  redis-data:
    name: detector-redis-data
  tempo-data:
    name: detector-tempo-data
  prometheus-data:
    name: detector-prometheus-data
  grafana-data:
    name: detector-grafana-data

networks:
  detector-net:
    name: detector-net
    driver: bridge
